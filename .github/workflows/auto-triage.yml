# .github/workflows/auto-triage.yml
#
# Watches other workflows. When one fails on main, grabs the failing step's log
# and opens an issue tagging @claude, which fires claude.yml.
#
# Deduplicated by workflow + commit sha: a job that fails twelve times against
# the same commit overnight produces one issue, not twelve.

name: Auto-triage CI failure

on:
  workflow_run:
    # Names match the `name:` field inside each workflow file, not the filename.
    #
    # Deliberately excludes this workflow, the responder (Claude), and the two
    # outcome watchers (Morning outcome watch, Tips outcome watch) — watching
    # itself or the responder turns one failure into a loop, and the watchers
    # already file their own issues with far better diagnostics than a log tail.
    #
    # Also excludes the push-triggered probes (pf-verify, puntingform-probe,
    # racing-com-probe, pf-backfill) and the manual-dispatch analysis jobs. Those
    # run on demand or fail for reasons a fix cannot address — racing-com-probe
    # is blocked on a secret it does not have.
    workflows:
      - "deploy-infra"            # deploy
      - "post-deploy-verify"      # deploy verification
      - "ci"                      # tests, on every push
      - "pf-morning-racecards"    # 05:30 AEST, feeds everything downstream
      - "betfair-odds-snapshot"   # 07:45 and 10:45 AEST price capture
      - "pf-evening-results"      # 20:30 AEST settlement; the silent-no-op fixed in 7fae98c
      - "sectional-schedules"     # Sun/Wed 21:00 AEST; three collectors with row gates
      - "schedule-audit"          # 04:20 AEST; fails only when the account has ZERO schedules
      - "evidence-audit"          # 04:25 AEST; fails when the evidence store is unreadable
    types: [completed]

permissions:
  contents: read
  issues: write
  # `read` to fetch the failing log; `write` to dispatch claude.yml. The default
  # token does not carry actions:write, and without it the dispatch fails with
  # HTTP 403 "Resource not accessible by integration" rather than silently doing
  # nothing — which is the right failure mode, but only if you know to expect it.
  actions: write

jobs:
  resolved:
    # A success closes the open issue for the same workflow.
    #
    # Without this, a fixed problem leaves its issue open forever. That is not
    # just untidy: the dedupe above keys on workflow + commit, so a stale open
    # issue for a workflow that has since been fixed and has since failed again
    # on a NEW commit does file a fresh issue — but the backlog of resolved-yet-
    # open issues makes the label useless for telling what is actually broken
    # right now. morning-watch.yml already does exactly this for its own
    # suppressor, with the same reasoning; this is that pattern applied here.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Close triage issues for a workflow that now passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # Title prefix only — the sha differs per issue, so this closes every
          # open report for this workflow, not just the most recent commit's.
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label auto-triage \
            --search "\"Auto-triage: ${WF_NAME} failed on\" in:title" \
            --json number,title --jq '.[] | select(.title | startswith("Auto-triage: '"${WF_NAME}"' failed on")) | .number' > resolved.txt

          if [ ! -s resolved.txt ]; then
            echo "No open triage issue for ${WF_NAME}."
            exit 0
          fi

          cat > closed.md <<EOF
          Closed automatically: \`${WF_NAME}\` passed on \`main\`.

          Run: ${RUN_URL}

          If the underlying cause was not actually fixed, the next failure files a fresh
          issue. This one should not sit open in the meantime — a backlog of
          resolved-but-open reports makes the \`auto-triage\` label stop meaning
          "currently broken", which is the only thing it is useful for.
          EOF

          while read -r n; do
            [ -n "$n" ] || continue
            echo "Closing #$n — ${WF_NAME} passed."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$(cat closed.md)"
          done < resolved.txt

  triage:
    # Only main. Feature-branch failures are yours to look at, not the agent's.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Collect the failing log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log 2>/dev/null \
            || echo "(no failed-step log retrievable for run $RUN_ID)" > failed.log

          # Last 300 lines, hard-capped at 20k chars. GitHub issue bodies cap at
          # 65536, and the tail is where the actual error lives anyway.
          tail -n 300 failed.log | tail -c 20000 > trimmed.log
          wc -l trimmed.log

      - name: Open triage issue
        id: file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${HEAD_SHA:0:7}"
          TITLE="Auto-triage: ${WF_NAME} failed on ${SHORT_SHA}"

          # Dedupe. Same workflow, same commit, already reported -> stop.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label auto-triage \
            --search "\"$TITLE\" in:title" \
            --json number --jq 'length')

          if [ "$EXISTING" != "0" ]; then
            echo "Already an open issue for ${WF_NAME} @ ${SHORT_SHA}. Not filing again."
            echo "filed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "\`${WF_NAME}\` failed on \`main\` at \`${SHORT_SHA}\`."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "<details><summary>Failing step output (tail)</summary>"
            echo
            echo '```'
            cat trimmed.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "---"
            echo
            echo "@claude Investigate this failure and open a pull request with a fix."
            echo
            echo "Rules for this task:"
            echo "- Open a PR against \`main\`. Do not commit to \`main\` directly."
            echo "- Do not modify anything under \`infra/\`. Those scripts have"
            echo "  full-replacement semantics and a wrong edit silently reverts live state."
            echo "- If the root cause is a job that exited 0 without doing its work,"
            echo "  say so explicitly — that class is already tracked in the execution register."
            echo "- If you cannot determine the cause with confidence, comment with your"
            echo "  findings and open no PR. A wrong fix is worse than no fix here."
          } > body.md

          URL=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --label auto-triage \
            --body-file body.md)
          echo "$URL"
          echo "filed=true" >> "$GITHUB_OUTPUT"
          echo "issue=${URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Wake the agent
        # Only when the issue was newly filed. The dedupe above keys on workflow
        # + commit, so this is also the retry cap: one agent run per failing
        # commit, however many times the schedule re-runs it overnight. A job
        # that fails twelve times against the same sha wakes the agent once.
        #
        # Dispatch rather than relying on the issue body's "@claude": issues
        # authored by GITHUB_TOKEN do not create workflow runs, so that mention
        # has never once woken anything. workflow_dispatch is the documented
        # exception to that rule and always creates a run.
        if: steps.file.outputs.filed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ISSUE: ${{ steps.file.outputs.issue }}
        run: |
          set -euo pipefail
          gh workflow run claude.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source=auto-triage \
            -f failed_workflow="$WF_NAME" \
            -f run_id="$RUN_ID" \
            -f issue_number="$ISSUE"
          echo "dispatched claude.yml for ${WF_NAME} run ${RUN_ID} (issue #${ISSUE})"
