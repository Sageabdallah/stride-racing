# Punting Form API probe — Phase A of PUNTINGFORM_MIGRATION.md. Read-only:
# prints Punting Form's own API reference into the run log and exercises
# candidate endpoint shapes with the PUNTINGFORM_API_KEY secret. Punting Form
# has no Betfair-style geo-wall, so this runs on GitHub-hosted runners.
#
# Push trigger is scoped to the migration branch + probe files only (GitHub
# cannot dispatch a workflow that exists solely on a non-default branch);
# once on main, the Run workflow button takes over.

name: puntingform-probe

on:
  workflow_dispatch:
    inputs:
      meeting_ids:
        description: "DM-H2: comma-separated PF meetingIds for the last10 as-of fetch (empty = original Phase A probe only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: puntingform-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Punting Form API
        env:
          PUNTINGFORM_API_KEY: ${{ secrets.PUNTINGFORM_API_KEY }}
        run: python3 scripts/puntingform_probe.py

  last10-asof-fetch:
    # DM-H2: raw meeting_detail payloads for the last10 as-of-semantics
    # probe. PF fetches ONLY — every DB-side step (meeting selection,
    # recorded finishes, pf_raw_payloads archive diff) runs off-CI where
    # DATABASE_URL lives. The key is injected as env and never printed.
    if: github.event.inputs.meeting_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch meeting_detail payloads
        env:
          PUNTINGFORM_API_KEY: ${{ secrets.PUNTINGFORM_API_KEY }}
          MEETING_IDS: ${{ github.event.inputs.meeting_ids }}
        run: python3 scripts/pf_last10_asof_probe.py fetch $MEETING_IDS
      - uses: actions/upload-artifact@v4
        with:
          name: pf-last10-asof-${{ github.run_number }}
          path: pf_last10_asof_artifacts/
          retention-days: 14
