# Punting Form backfill verification — Phase B sign-off of
# PUNTINGFORM_MIGRATION.md. READ-ONLY: pf_verify_backfill.py SELECTs against
# race_results_history / pf_raw_payloads and reads the PF calendar; it writes
# nothing. Re-run any time to re-check coverage, NULL rates, the old-pipeline
# death date, the runtime PF wall (binary-searched, it slides), lost dates,
# and the horse-ID bridge.
#
# Push trigger is scoped to this branch + these files for first registration
# (GitHub cannot dispatch a workflow that exists solely on a non-default
# branch); push runs always verify the default range.

name: pf-verify

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to verify (ISO)"
        default: "2026-06-08"
      end:
        description: "Last date (ISO); empty = today AEST"
        default: ""

permissions:
  contents: read

concurrency:
  group: pf-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install psycopg2
        run: pip install --quiet psycopg2-binary
      - name: Verify backfill coverage and gap report
        env:
          PUNTINGFORM_API_KEY: ${{ secrets.PUNTINGFORM_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          ARGS="--start ${START:-2026-06-08}"
          if [ -n "$END" ]; then ARGS="$ARGS --end $END"; fi
          echo "running: pf_verify_backfill.py $ARGS"
          python3 server/python/pf_verify_backfill.py $ARGS
