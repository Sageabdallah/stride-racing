# Betfair odds snapshot capture — runs betfair_odds_snapshot.py on the
# self-hosted AU runner (GitHub-hosted runners are geo-blocked by Betfair's
# edge; see scripts/BETFAIR_KEYS_STATUS.md). Writes runner_odds_snapshots
# rows — the task-12 retrain clock. Markets map against race_schedule, which
# is populated by the day's tips pipeline: dispatch AFTER tips have run for
# the date, or every market reports unmapped and nothing is written.
#
# Scheduled (WP-2) after the 2026-08-02 dispatch runs were eyeballed clean.
# GitHub cron is UTC and does not follow Sydney DST; these times drift one
# hour across transitions. Interim only: WP-7 moves this to EventBridge
# Scheduler with an explicit Australia/Sydney timezone.

name: betfair-odds-snapshot

on:
  schedule:
    - cron: "45 21 * * *"  # 07:45 AEST morning capture (after 05:30 card+seed)
    - cron: "45 0 * * *"   # 10:45 AEST tip_time capture (after the 10:00 tips window)
  workflow_dispatch:
    inputs:
      date:
        description: "Race day (ISO, AEST); empty = today"
        default: ""
      kind:
        description: "snapshot_kind for the rows"
        type: choice
        default: "tip_time"
        options: ["tip_time", "late_t5", "morning", "baseline"]
      commit:
        description: "Write rows (unchecked = dry run report only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: betfair-odds-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        # The runner's system python is PEP-668 externally managed — pip
        # refuses global installs, so run out of a throwaway venv.
        run: |
          python3 -m venv .wfvenv
          .wfvenv/bin/pip install --quiet psycopg2-binary requests
      - name: Capture snapshot
        env:
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          # BETFAIR_SESSION_TOKEN deliberately not passed: the stored secret is a
          # dead ssoid (ACTION_THIS item) and betfair_auth prefers a token over a
          # fresh login, so passing it fails with INVALID_SESSION_INFORMATION.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE_INPUT: ${{ inputs.date }}
          KIND_INPUT: ${{ inputs.kind }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          DATE=${DATE_INPUT:-$(TZ=Australia/Sydney date +%F)}
          KIND=$KIND_INPUT
          if [ -z "$KIND" ]; then
            # Schedule-triggered runs carry no inputs: pick the kind from the
            # UTC hour the two cron lines fire at.
            if [ "$(date -u +%H)" -ge 12 ]; then KIND=morning; else KIND=tip_time; fi
          fi
          ARGS=(--date "$DATE" --kind "$KIND")
          if [ "${COMMIT_INPUT:-true}" != "false" ]; then ARGS+=(--commit); fi
          .wfvenv/bin/python server/python/betfair_odds_snapshot.py "${ARGS[@]}"
