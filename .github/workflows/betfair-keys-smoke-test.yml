# Betfair credentials smoke test — proves the Betfair secrets stored in this
# repo's Actions secrets actually work, end to end, without touching money:
#
#   1. Reports which candidate BETFAIR_* secret names are set (never values —
#      only set/unset, character length, and a leading/trailing-whitespace
#      warning, since an invisible newline pasted into a secret is the classic
#      cause of "I reset my password and it still fails").
#   2. Makes ONE interactive login attempt against the Betfair identity SSO
#      (AU host first by default). It deliberately does not retry a
#      credential failure on the other host — repeated failures are what lock
#      the account.
#   3. On login success: read-only listEventTypes to prove the app key is
#      accepted by the Exchange API, getDeveloperAppKeys to say whether the
#      stored key is the live or delayed-data one, then logs out.
#
# The job never checks out the repo and never prints a secret. Login statuses
# are printed with a plain-language explanation and the job exits non-zero on
# anything short of a working login + accepted app key.

name: betfair-keys-smoke-test

# The push trigger is scoped to the smoke-test branch because GitHub won't
# dispatch a workflow that only exists on a non-default branch — pushing to
# the branch IS the run button. Drop the push trigger if this ever merges.
on:
  push:
    branches: ["claude/betfair-keys-smoke-test-4yqny1"]
  workflow_dispatch:
    inputs:
      hosts:
        description: "SSO host order (AU account -> au first)"
        type: choice
        default: "au-then-com"
        options: ["au-then-com", "com-then-au", "au-only", "com-only"]

permissions:
  contents: read

concurrency:
  group: betfair-keys-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Candidate secret names — unset ones arrive as empty strings, and the
      # script reports which of these actually exist in the repo's secrets.
      BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
      BETFAIR_APPKEY: ${{ secrets.BETFAIR_APPKEY }}
      BETFAIR_API_KEY: ${{ secrets.BETFAIR_API_KEY }}
      BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
      BF_APP_KEY: ${{ secrets.BF_APP_KEY }}
      BETFAIR_APP_KEY_LIVE: ${{ secrets.BETFAIR_APP_KEY_LIVE }}
      BETFAIR_APP_KEY_DELAYED: ${{ secrets.BETFAIR_APP_KEY_DELAYED }}
      BETFAIR_LIVE_APP_KEY: ${{ secrets.BETFAIR_LIVE_APP_KEY }}
      BETFAIR_DELAYED_APP_KEY: ${{ secrets.BETFAIR_DELAYED_APP_KEY }}
      BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_USER: ${{ secrets.BETFAIR_USER }}
      BETFAIR_EMAIL: ${{ secrets.BETFAIR_EMAIL }}
      BETFAIR_LOGIN: ${{ secrets.BETFAIR_LOGIN }}
      BF_USERNAME: ${{ secrets.BF_USERNAME }}
      BF_USER: ${{ secrets.BF_USER }}
      BETFAIR_UN: ${{ secrets.BETFAIR_UN }}
      BETFAIR_USR: ${{ secrets.BETFAIR_USR }}
      BETFAIR_USER_NAME: ${{ secrets.BETFAIR_USER_NAME }}
      BETFAIR_USERID: ${{ secrets.BETFAIR_USERID }}
      BETFAIR_ACCOUNT: ${{ secrets.BETFAIR_ACCOUNT }}
      USERNAME: ${{ secrets.USERNAME }}
      EMAIL: ${{ secrets.EMAIL }}
      BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      BETFAIR_PASS: ${{ secrets.BETFAIR_PASS }}
      BETFAIR_PW: ${{ secrets.BETFAIR_PW }}
      BF_PASSWORD: ${{ secrets.BF_PASSWORD }}
      BF_PASS: ${{ secrets.BF_PASS }}
      BETFAIR_PWD: ${{ secrets.BETFAIR_PWD }}
      BETFAIR_PASSWD: ${{ secrets.BETFAIR_PASSWD }}
      BETFAIR_LOGIN_PASSWORD: ${{ secrets.BETFAIR_LOGIN_PASSWORD }}
      BETFAIR_SECRET: ${{ secrets.BETFAIR_SECRET }}
      PASSWORD: ${{ secrets.PASSWORD }}
      BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
      BETFAIR_CERT_PEM: ${{ secrets.BETFAIR_CERT_PEM }}
      BETFAIR_CERT_KEY: ${{ secrets.BETFAIR_CERT_KEY }}
      SMOKE_HOSTS: ${{ inputs.hosts }}
    steps:
      - name: Betfair login + app key smoke test
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          APP_KEY_NAMES  = ["BETFAIR_APP_KEY", "BETFAIR_APP_KEY_LIVE", "BETFAIR_LIVE_APP_KEY", "BETFAIR_APPKEY",
                            "BETFAIR_API_KEY", "BETFAIR_KEY", "BF_APP_KEY",
                            "BETFAIR_APP_KEY_DELAYED", "BETFAIR_DELAYED_APP_KEY"]
          USERNAME_NAMES = ["BETFAIR_USERNAME", "BETFAIR_USER", "BETFAIR_EMAIL", "BETFAIR_LOGIN", "BF_USERNAME",
                            "BF_USER", "BETFAIR_UN", "BETFAIR_USR", "BETFAIR_USER_NAME", "BETFAIR_USERID",
                            "BETFAIR_ACCOUNT", "USERNAME", "EMAIL"]
          PASSWORD_NAMES = ["BETFAIR_PASSWORD", "BETFAIR_PASS", "BETFAIR_PW", "BF_PASSWORD", "BF_PASS",
                            "BETFAIR_PWD", "BETFAIR_PASSWD", "BETFAIR_LOGIN_PASSWORD", "BETFAIR_SECRET", "PASSWORD"]
          CERT_NAMES     = ["BETFAIR_CERT", "BETFAIR_CERT_PEM", "BETFAIR_CERT_KEY"]

          EXPLAIN = {
              "SUCCESS": "login accepted — credentials are good",
              "LIMITED_ACCESS": "login accepted but the account has limited access (site prompt outstanding)",
              "LOGIN_RESTRICTED": "login is restricted on this account — check the Betfair website",
              "ACCOUNT_PENDING_PASSWORD_CHANGE": "Betfair still requires a password change: log in on the Betfair WEBSITE, complete the forced password change, then update the GitHub secret to the new password",
              "CHANGE_PASSWORD_REQUIRED": "Betfair requires the password to be changed on the website before the API will accept logins",
              "INVALID_USERNAME_OR_PASSWORD": "the username/password in the GitHub secrets was rejected — if the password was reset on the website, the secret must be updated to the NEW password",
              "ACCOUNT_NOW_LOCKED": "this attempt tipped the account into locked state — unlock on the Betfair website before any retry",
              "ACCOUNT_ALREADY_LOCKED": "the account is locked (usually from repeated failed logins) — unlock via the Betfair website/support, then retry",
              "TEMPORARY_BAN_TOO_MANY_REQUESTS": "too many recent login attempts — wait at least 20 minutes before retrying",
              "PENDING_AUTH": "a verification step (2FA / identity check) is outstanding on the account — complete it on the website",
              "KYC_SUSPEND": "account suspended pending identity verification — resolve on the website",
              "SUSPENDED": "the account is suspended — contact Betfair",
              "CLOSED": "the account is closed",
              "SELF_EXCLUDED": "the account is self-excluded",
              "BETTING_RESTRICTED_LOCATION": "the request came from a location Betfair blocks (GitHub runners sit in US data centres) — this does NOT disprove the credentials; the same test from an allowed country (e.g. the Mac in Australia) is the fallback",
              "SECURITY_RESTRICTED_LOCATION": "blocked because of the request's source location (GitHub runners sit in US data centres) — this does NOT disprove the credentials",
              "DUPLICATE_CARDS": "duplicate card details on the account — resolve on the website",
              "SECURITY_QUESTION_WRONG_3X": "security question failed three times — account needs attention on the website",
              "INPUT_VALIDATION_ERROR": "the request fields were rejected — usually an empty/garbled username or password value in the secret",
          }
          # Statuses where attempting the other SSO host would just burn
          # another login attempt from the same IP for the same outcome.
          NO_SECOND_HOST = set(EXPLAIN) - {"INPUT_VALIDATION_ERROR"}

          def banner(t):
              print()
              print("=" * 72)
              print(t)
              print("=" * 72)

          def http_json(url, data=None, headers=None, timeout=30):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  try:
                      return e.code, json.loads(body)
                  except Exception:
                      return e.code, {"_raw": body[:300]}
              except Exception as e:
                  return None, {"_transport": f"{type(e).__name__}: {e}"}

          def report_and_pick(label, names, show_len=True):
              # show_len=False for username/password: this is a public repo, so
              # even a credential's length stays out of the log.
              print(f"  {label}:")
              picked, picked_name = "", None
              for n in names:
                  raw = os.environ.get(n, "")
                  if raw:
                      note = ""
                      if raw != raw.strip():
                          note = "   <-- WARNING: leading/trailing whitespace (stripped for this attempt; re-save the secret without it)"
                      size = f" ({len(raw)} chars)" if show_len else ""
                      print(f"    {n}: SET{size}{note}")
                      if picked_name is None and raw.strip():
                          picked, picked_name = raw.strip(), n
                  else:
                      print(f"    {n}: not set")
              print(f"    -> using: {picked_name or 'NONE FOUND'}")
              return picked, picked_name

          banner("1. Which Betfair secrets exist in this repo (names only, never values)")
          app_key, app_key_name = report_and_pick("app key", APP_KEY_NAMES)
          username, username_name = report_and_pick("username", USERNAME_NAMES, show_len=False)
          password, password_name = report_and_pick("password", PASSWORD_NAMES, show_len=False)
          cert_present = [n for n in CERT_NAMES if os.environ.get(n)]
          print(f"  cert-login secrets present: {cert_present or 'none'} (cert login not attempted by this test)")

          missing = [lbl for lbl, v in [("app key", app_key), ("username", username), ("password", password)] if not v]
          if missing:
              banner("VERDICT: CANNOT TEST — secrets missing")
              print(f"  Missing: {', '.join(missing)}.")
              print("  None of the candidate names above were set for these. Add repository")
              print("  Actions secrets (repo Settings -> Secrets and variables -> Actions ->")
              print("  'Repository secrets'): BETFAIR_APP_KEY, BETFAIR_USERNAME, BETFAIR_PASSWORD.")
              print("  Note: 'Environment' secrets, Codespaces secrets and Dependabot secrets")
              print("  are separate stores and would NOT be visible to this job.")
              sys.exit(2)

          banner("2. Where is this runner (matters: Betfair geo-blocks some regions)")
          st, geo = http_json("https://ipapi.co/json/", headers={"User-Agent": "curl/8"}, timeout=15)
          if isinstance(geo, dict) and geo.get("country"):
              print(f"  runner egress: {geo.get('ip')} — {geo.get('country_name', geo.get('country'))} ({geo.get('country')})")
          else:
              print(f"  could not determine runner location ({geo}) — continuing anyway")

          banner("3. Interactive SSO login (single attempt — no credential-failure retries)")
          order = {"au-then-com": ["au", "com"], "com-then-au": ["com", "au"],
                   "au-only": ["au"], "com-only": ["com"]}[os.environ.get("SMOKE_HOSTS") or "au-then-com"]
          form = urllib.parse.urlencode({"username": username, "password": password}).encode()
          headers = {"X-Application": app_key, "Accept": "application/json",
                     "Content-Type": "application/x-www-form-urlencoded"}

          token, login_host, final_status, final_error = "", None, None, None
          for host in order:
              url = f"https://identitysso.betfair.{host}/api/login"
              print(f"  POST {url}")
              st, body = http_json(url, data=form, headers=headers)
              if "_transport" in body:
                  print(f"    transport error: {body['_transport']} — trying next host if one is configured")
                  final_status, final_error = "TRANSPORT_ERROR", body["_transport"]
                  continue
              status = body.get("status") or body.get("loginStatus") or f"HTTP_{st}"
              error = body.get("error") or ""
              final_status, final_error, login_host = status, error, host
              print(f"    status: {status}   error: {error or '(none)'}")
              key = error or status
              if key in EXPLAIN:
                  print(f"    meaning: {EXPLAIN[key]}")
              if status == "SUCCESS" and body.get("token"):
                  token = body["token"]
                  break
              if (error in NO_SECOND_HOST) or (status in NO_SECOND_HOST):
                  print("    not trying the other host: it would consume another login attempt from the same IP for the same result")
                  break

          if not token:
              banner(f"VERDICT: LOGIN FAILED on identitysso.betfair.{login_host or order[-1]}")
              key = (final_error or final_status or "")
              print(f"  status={final_status} error={final_error or '(none)'}")
              print(f"  {EXPLAIN.get(key, 'see the status/error above; full status list: Betfair Non-Interactive/Interactive Login docs')}")
              sys.exit(1)

          banner("4. Exchange API check with the stored app key (read-only)")
          api_headers = {"X-Application": app_key, "X-Authentication": token,
                         "Content-Type": "application/json", "Accept": "application/json"}
          st, body = http_json("https://api.betfair.com/exchange/betting/rest/v1.0/listEventTypes/",
                               data=json.dumps({"filter": {}}).encode(), headers=api_headers)
          app_key_ok = False
          if st == 200 and isinstance(body, list):
              app_key_ok = True
              names = {e.get("eventType", {}).get("id"): e.get("eventType", {}).get("name") for e in body}
              print(f"  listEventTypes: HTTP 200, {len(body)} event types returned")
              print(f"  horse racing available: {'YES' if '7' in names else 'no (!)'}")
          else:
              code = ""
              if isinstance(body, dict):
                  code = (body.get("detail", {}) or {}).get("APINGException", {}).get("errorCode", "") or body.get("_raw", "")
              print(f"  listEventTypes: HTTP {st} — {code or body}")
              if "INVALID_APP_KEY" in str(code):
                  print("  meaning: the session/login is fine but the stored app key is not valid")
              elif "APP_KEY_NOT_ACTIVE" in str(code) or "ACCESS_DENIED" in str(code):
                  print("  meaning: the app key exists but is not activated for the Exchange API (delayed key not activated, or live key awaiting activation)")

          st, keys = http_json("https://api.betfair.com/exchange/account/rest/v1.0/getDeveloperAppKeys/",
                               data=b"{}", headers=api_headers)
          if st == 200 and isinstance(keys, list):
              print("  app keys registered on this Betfair account:")
              for app in keys:
                  for v in app.get("appVersions", []):
                      match = "MATCHES the stored secret" if v.get("applicationKey") == app_key else "different key"
                      print(f"    - app '{app.get('appName')}' v{v.get('version')}: delayed-data={v.get('delayData')} active={v.get('active')} -> {match}")
          else:
              print(f"  getDeveloperAppKeys: HTTP {st} (informational only)")

          http_json(f"https://identitysso.betfair.{login_host}/api/logout", data=b"",
                    headers={"X-Application": app_key, "X-Authentication": token, "Accept": "application/json"})
          print("  session logged out")

          banner("VERDICT")
          if app_key_ok:
              print(f"  KEYS OK — login SUCCESS on identitysso.betfair.{login_host} using")
              print(f"  {username_name}/{password_name}, and app key {app_key_name} was accepted by the Exchange API.")
              sys.exit(0)
          print(f"  PARTIAL — login on identitysso.betfair.{login_host} succeeded (username/password are good),")
          print(f"  but the app key {app_key_name} was NOT accepted by the Exchange API — see section 4.")
          sys.exit(1)
          PYEOF
