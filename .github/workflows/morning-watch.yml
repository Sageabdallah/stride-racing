# .github/workflows/morning-watch.yml
#
# Covers the gap. The 05:30 consensus job is a Fargate scheduled task, so no
# workflow_run trigger will ever see it fail.
#
# This checks the OUTCOME, not the exit code — did rows actually land. That is
# the only check that catches "ran, exited 0, did nothing", which is the class
# that produced three of the sixteen defects.
#
# Five outcomes, deliberately distinct. Connectivity is tested on its own, before
# the real query, so a broken query can never report itself as a network problem.
# Collapsing those two is what let a wrong column name make this watcher
# permanently blind while still running nightly and filing issues:
#
#   rows > 0      -> silent. Working as intended.
#   rows == 0 and
#     quiet day   -> silent. There was no target-track racing, so there is no
#                    consensus to produce. Measured over the 75 days to
#                    2026-08-03, 28 of them were quiet — Mondays 8/10, Sundays
#                    and Tuesdays 6/11. Filing on those is not a watcher that
#                    catches a real failure three days a week; it is a watcher
#                    that teaches you to ignore its issues.
#     card built  -> @claude issue. The silent no-op class is still live upstream.
#     no card     -> @claude issue, but aimed at the RACECARD path, not consensus.
#                    Zero mentions is the same number either way; blaming the
#                    07:00 job for a 05:30 failure sends an agent to the wrong
#                    file, which costs a whole run to discover.
#   query broken  -> @claude issue. The watcher's own SQL is wrong: a code defect,
#                   fixable by an agent, and invisible until it is named.
#   unreachable   -> plain issue, no @claude. An agent cannot fix a network path,
#                   and pointing one at an unreachable database wastes turns.
#
# The quiet/card/neither signal comes from the pf-morning-racecards artifact
# rather than from the database. race_schedule row counts cannot answer it: zero
# rows means "quiet" or "the 05:30 died", which is the distinction being drawn.
# The artifact carries the producer's own evidence, and needs no new IAM grant.

name: Morning outcome watch

on:
  schedule:
    # 22:50 UTC == 08:50 AEST.
    #
    # This used to be 07:20, twenty minutes after a consensus job that started
    # at 07:00. #101 moved consensus to 05:30 and left this behind, which looks
    # like more slack and is the opposite. consensus_agent accumulates every
    # race into `all_mentions` and writes it in ONE batch at the end
    # (consensus_agent.py:1858), so `consensus_mentions` is empty for the whole
    # run, not filling as it goes. A Saturday card takes hours — measured
    # ~2.6 min/race — so a 07:20 check would read a perfectly healthy run that
    # is 40 races in as zero rows, and file the silent-no-op issue against it.
    #
    # That false issue would be indistinguishable from the real ones this
    # watcher filed on Aug 5, 6 and 7 (#88, #95, #103), which is precisely how
    # a watcher stops being read.
    #
    # 08:50 sits after the 08:05 tips start, so consensus has had its full
    # window. Detecting a consensus failure later costs nothing that matters:
    # tips has already begun by then either way, and a crashed consensus is
    # caught within 30 minutes by ecs-failure-watch regardless.
    #
    # AEST is UTC+10 year-round in NSW during winter; revisit in October when
    # daylight saving starts and this drifts an hour.
    - cron: "50 22 * * *"
  workflow_dispatch:        # so you can test it right now without waiting

permissions:
  contents: read
  issues: write
  # read: the pf-morning-racecards artifact. write: dispatch claude.yml when
  # this watcher escalates. auto-triage cannot cover the 06:00/07:00 jobs — they
  # are ECS tasks and emit no workflow_run event — so this watcher is their only
  # route to the agent, and it needs its own wire.
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Query consensus_mentions for today
        id: q
        env:
          # Needs a runner that can reach the warehouse. If the DB sits in a
          # private VPC subnet, a GitHub-hosted runner cannot reach it and the
          # connectivity probe below reports unreachable, not a crash.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          TODAY=$(TZ=Australia/Sydney date +%F)
          echo "target_date=$TODAY" >> "$GITHUB_OUTPUT"

          # A missing client exits 127 and would fail the probe below as though the
          # warehouse were unreachable — the same disguise the wrong column name
          # wore. Name it instead: no check ran at all, and an agent can fix that.
          if ! command -v psql >/dev/null 2>&1; then
            echo "status=query_broken" >> "$GITHUB_OUTPUT"
            {
              echo "err<<STRIDE_ERR_EOF"
              echo "psql is not on the runner, so no check ran. This is not a network"
              echo "problem and the morning outcome is unverified."
              echo "STRIDE_ERR_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Connectivity, on its own, before anything schema-dependent touches it.
          # `select 1` needs no tables, so a failure here is the network or the
          # credential and nothing else.
          psql "$DATABASE_URL" -tAc "select 1;" >/dev/null 2>conn_err.txt
          if [ $? -ne 0 ]; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            {
              echo "err<<STRIDE_ERR_EOF"
              head -c 2000 conn_err.txt
              echo ""
              echo "STRIDE_ERR_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The connection is known good, so any failure past this point is the
          # watcher's own SQL — a wrong column, a renamed table, a dropped index.
          ROWS=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from consensus_mentions where race_date = '$TODAY';" 2>q_err.txt)
          if [ $? -ne 0 ]; then
            echo "status=query_broken" >> "$GITHUB_OUTPUT"
            {
              echo "err<<STRIDE_ERR_EOF"
              head -c 2000 q_err.txt
              echo ""
              echo "STRIDE_ERR_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # psql exited 0, but a non-numeric answer means this is not counting
          # what it claims to count. Treat it as broken rather than as zero —
          # reading it as zero would file a false silent-no-op report.
          case "$ROWS" in
            ''|*[!0-9]*)
              echo "status=query_broken" >> "$GITHUB_OUTPUT"
              {
                echo "err<<STRIDE_ERR_EOF"
                echo "psql exited 0 but returned a non-numeric count: '${ROWS}'"
                echo "STRIDE_ERR_EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          if [ "$ROWS" -gt 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=empty" >> "$GITHUB_OUTPUT"
          fi

      - name: Was there anything to build consensus from?
        # Only asked when the count is zero. Zero mentions has three causes and
        # they need three different responses, so the count alone is not enough
        # to act on.
        #
        # The date in the filename is what makes this self-validating: if the
        # most recent racecard run is stale, neither racecard_$TODAY.json nor
        # quiet_$TODAY.json is present, and the verdict falls to racecard_dead —
        # which is the correct reading of "today's 05:30 produced nothing".
        id: card
        if: steps.q.outputs.status == 'empty'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODAY: ${{ steps.q.outputs.target_date }}
        run: |
          set +e
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow pf-morning-racecards.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          rm -rf card_art && mkdir -p card_art
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              -n racecard -D card_art >/dev/null 2>&1
          fi
          ls -la card_art || true

          if [ -f "card_art/quiet_$TODAY.json" ]; then
            echo "verdict=quiet" >> "$GITHUB_OUTPUT"
            echo "Quiet day: the provider listed meetings, none on the target list."
            cat "card_art/quiet_$TODAY.json"
          elif [ -f "card_art/racecard_$TODAY.json" ]; then
            echo "verdict=card" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=racecard_dead" >> "$GITHUB_OUTPUT"
          fi

      - name: Quiet day — nothing to report
        if: steps.q.outputs.status == 'empty' && steps.card.outputs.verdict == 'quiet'
        env:
          TODAY: ${{ steps.q.outputs.target_date }}
        run: |
          {
            echo "## Morning watch — $TODAY"
            echo
            echo "**Quiet day.** Punting Form listed meetings but none were on the"
            echo "target-track list, so there was no consensus to build and"
            echo "\`consensus_mentions\` is correctly empty. No issue filed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Racecard never arrived — escalate to Claude
        if: steps.q.outputs.status == 'empty' && steps.card.outputs.verdict == 'racecard_dead'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.q.outputs.target_date }}
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          \`consensus_mentions\` has zero rows for \`${TARGET_DATE}\`, and the 05:30
          \`pf-morning-racecards\` run produced **neither** a racecard nor a quiet-day
          sentinel for that date.

          So this is very probably not a consensus defect. The consensus job had nothing to
          work from. Zero mentions is the same number whichever job failed, which is why
          this branch exists separately: starting from \`consensus_agent.py\` here means
          spending a whole run to arrive back at 05:30.

          @claude Start at the racecard path, not the consensus path. Check the most
          recent \`pf-morning-racecards\` run and \`download_racecards.py\`.

          Rules for this task:
          - Open a PR against \`main\`. Never commit to \`main\` directly.
          - Do not touch anything under \`infra/*.sh\`.
          - Do not backfill or insert rows to make the check pass. The empty table is the
            symptom; find what upstream of it returned nothing.
          - A quiet day is NOT this. A quiet day writes \`quiet_<date>.json\` and is
            handled silently. This branch means neither file exists, which is a failure.
          - If the cause is not clear from the logs, comment with findings and open no PR.
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morning watch: no racecard and no consensus for ${TARGET_DATE}" \
            --label auto-triage \
            --body-file body.md

      - name: Silent no-op — escalate to Claude
        if: steps.q.outputs.status == 'empty' && steps.card.outputs.verdict == 'card'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.q.outputs.target_date }}
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          The 07:00 Fargate task ran and \`consensus_mentions\` has zero rows for \`${TARGET_DATE}\`.

          **A racecard was built for this date** — \`racecard_${TARGET_DATE}.json\` is present in
          the \`pf-morning-racecards\` artifact — so there were races to find mentions for, and
          this is not a quiet day. That check is why this issue is worth your turns: it rules
          out the explanation that accounts for roughly a third of all days.

          This is the silent no-op class: exited without producing output. Commit \`1aee192\`
          made the morning jobs fail loudly when they produce nothing, and \`4c93fea\` recorded
          the class in the execution register. If this issue exists, either the fix did not
          cover this path or the cause sits upstream of it.

          @claude Trace why the consensus path produced no rows. Read the task logs first.

          Rules for this task:
          - Open a PR against \`main\`. Never commit to \`main\` directly.
          - Do not touch anything under \`infra/*.sh\`.
          - Do not backfill or insert rows to make the check pass. The empty table is the
            symptom; find what upstream of it returned nothing.
          - If the cause is not clear from the logs, comment with findings and open no PR.
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morning watch: consensus_mentions empty for ${TARGET_DATE}" \
            --label auto-triage \
            --body-file body.md

      - name: Zero rows and no verdict — escalate anyway
        # The verdict step sets one of three values on every path, so reaching
        # here means it did not run to completion at all. A watcher that goes
        # quiet because its own classifier broke is the failure this file
        # exists to catch, so the unknown case escalates rather than falling
        # through the three exact-match branches into silence.
        if: >-
          steps.q.outputs.status == 'empty'
          && steps.card.outputs.verdict != 'quiet'
          && steps.card.outputs.verdict != 'card'
          && steps.card.outputs.verdict != 'racecard_dead'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.q.outputs.target_date }}
          VERDICT: ${{ steps.card.outputs.verdict }}
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          \`consensus_mentions\` has zero rows for \`${TARGET_DATE}\`, and the step that
          decides whether that is a quiet day, a dead racecard or a real silent no-op
          produced no verdict (got: \`${VERDICT:-<empty>}\`).

          So the count is unexplained rather than explained-and-benign. Filing rather than
          staying silent, because a watcher whose own classifier failed looks exactly like
          a watcher with nothing to report.

          @claude Check the "Was there anything to build consensus from?" step in the most
          recent \`Morning outcome watch\` run, then determine the real cause of the zero.

          Rules for this task:
          - Open a PR against \`main\`. Never commit to \`main\` directly.
          - Do not touch anything under \`infra/*.sh\`.
          - Do not backfill or insert rows to make the check pass.
          - If the cause is not clear from the logs, comment with findings and open no PR.
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morning watch: unclassified zero for ${TARGET_DATE}" \
            --label auto-triage \
            --body-file body.md

      - name: Watcher query broken — escalate to Claude
        if: steps.q.outputs.status == 'query_broken'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.q.outputs.target_date }}
          ERR: ${{ steps.q.outputs.err }}
        run: |
          set -euo pipefail
          TITLE="Morning watch query is broken"

          # Deduped on a date-free title, unlike the other branches. A wrong query
          # fails identically every night until someone merges the fix, and every
          # issue wakes an agent — without this it files a fresh issue and burns a
          # fresh set of turns nightly for as long as it takes to notice.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label auto-triage \
            --search "\"$TITLE\" in:title" \
            --json number --jq 'length')

          if [ "$EXISTING" != "0" ]; then
            echo "Already an open issue for the broken watcher query. Not filing again."
            exit 0
          fi

          cat > body.md <<EOF
          The database answered \`select 1\`, so the warehouse is reachable and the
          credential is good. The watcher's own query then failed.

          The morning outcome for \`${TARGET_DATE}\` is **unverified** — not confirmed
          good, not confirmed bad — and it stays unverified every night until this
          query is fixed.

          \`\`\`
          ${ERR}
          \`\`\`

          @claude Fix the query in \`.github/workflows/morning-watch.yml\` so it counts
          what it claims to count.

          Rules for this task:
          - Open a PR against \`main\`. Never commit to \`main\` directly.
          - Do not touch anything under \`infra/\`.
          - Read the column names out of \`migrations/\` rather than inferring them.
            This watcher was blind once already because \`consensus_mentions\` was
            queried on a \`date\` column it has never had; the real one is \`race_date\`.
          - Do not make this pass by deleting or weakening the check. An unverified
            morning is the thing being reported, not an inconvenience to silence.
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --label auto-triage \
            --body-file body.md

      - name: Watcher blind — notify, do not escalate
        if: steps.q.outputs.status == 'unreachable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.q.outputs.target_date }}
          ERR: ${{ steps.q.outputs.err }}
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          The watcher could not reach the warehouse, so the morning outcome is **unknown** —
          not confirmed good, not confirmed bad. Check \`consensus_mentions\` by hand.

          No @claude tag on this one deliberately: this is a connectivity problem, not a
          code defect, and an agent cannot fix the network path from a runner.

          \`\`\`
          ${ERR}
          \`\`\`
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morning watch could not verify ${TARGET_DATE}" \
            --label watcher-health \
            --body-file body.md

      - name: Clear the query-broken suppressor
        # Runs whenever the query demonstrably executed — `empty` proves that just
        # as well as `ok` does, and a run of quiet days must not keep a stale
        # suppressor alive.
        if: steps.q.outputs.status == 'ok' || steps.q.outputs.status == 'empty'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Morning watch query is broken"

          # The query_broken issue is deduped on a date-free title, which makes
          # closing it load-bearing: fix the query, forget to close, and the next
          # genuine break is suppressed by a stale open issue — silently, which is
          # the exact shape this whole loop exists to catch. A working query clears
          # its own suppressor so the suppression can never outlive the condition.
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label auto-triage \
            --search "\"$TITLE\" in:title" \
            --json number --jq '.[].number' > stale.txt

          if [ ! -s stale.txt ]; then
            echo "No open query-broken issue to clear."
            exit 0
          fi

          TODAY=$(TZ=Australia/Sydney date +%F)
          while read -r n; do
            [ -n "$n" ] || continue
            echo "Closing #$n — the watcher query ran successfully."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Closed automatically: the watcher query executed successfully on ${TODAY}, so it is no longer broken. The next failure files a fresh issue; this one must not sit open suppressing it."
          done < stale.txt

      - name: Wake the agent
        # Fires on exactly the states the four escalation steps above file a
        # @claude issue for, and on nothing else. Mirroring the condition rather
        # than editing those four steps keeps the working escalation paths
        # untouched; the cost is that this expression and theirs must stay in
        # step, which is why it is written in the same vocabulary.
        #
        #   empty + not quiet -> racecard_dead, card, or unclassified: escalated
        #   query_broken      -> the watcher's own SQL: escalated
        #   quiet             -> correct silence, no wake
        #   unreachable       -> a network path an agent cannot fix, no wake
        #   ok                -> nothing to do
        #
        # The consensus and intelligence jobs this covers are Fargate tasks.
        # They emit no workflow_run event, so auto-triage.yml never sees them
        # and this is the only thing that can wake the agent for them.
        if: >-
          steps.q.outputs.status == 'query_broken' ||
          (steps.q.outputs.status == 'empty' && steps.card.outputs.verdict != 'quiet')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only wake the agent for an issue THIS run filed. The escalation steps
          # above dedupe by title, so a fault that persists for a fortnight files
          # one issue and then suppresses itself — but the wake condition is
          # status-based and would keep firing, spending 20 turns a night against
          # the OAuth quota, stacking comments on a suppressed thread where nobody
          # is looking. Freshness is the cheap stand-in for "did we just file it":
          # an issue older than an hour is one the dedupe already had.
          read -r ISSUE CREATED < <(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label auto-triage --limit 1 \
            --json number,createdAt --jq '.[0] | "\(.number) \(.createdAt)"' || echo " ")
          if [ -z "${ISSUE:-}" ]; then
            echo "No open auto-triage issue to attach a diagnosis to. Not dispatching."
            exit 0
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$CREATED" +%s 2>/dev/null || echo 0) ))
          if [ "$AGE" -gt 3600 ]; then
            echo "Newest auto-triage issue #$ISSUE is ${AGE}s old — already deduped."
            echo "The fault is known and reported. Not spending an agent run on it again."
            exit 0
          fi
          gh workflow run claude.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source=morning-watch \
            -f failed_workflow="morning chain (racecard/intelligence/consensus, Fargate)" \
            -f run_id="" \
            -f issue_number="$ISSUE"
          echo "dispatched claude.yml (issue #$ISSUE, filed ${AGE}s ago)"

      - name: Report
        run: |
          echo "status=${{ steps.q.outputs.status }} rows=${{ steps.q.outputs.rows }} racecard=${{ steps.card.outputs.verdict }}"
