# Punting Form evening results import — Phase C of PUNTINGFORM_MIGRATION.md.
# Imports results for today AND yesterday AEST (late/abandoned meetings
# resolve the next day) via fetch_and_import_date.py: PF meetings -> mapper
# -> dedup -> archive-first insert into race_results_history. Idempotent —
# re-runs insert zero for already-imported races.
#
# Cron is UTC: 10:30 UTC = 20:30 AEST (winter) / 21:30 AEDT (summer).
# The local-time intent is 20:30 AEST, after the last AU race is resulted.
#
# Push trigger is scoped to this branch + these files for first registration
# (GitHub cannot dispatch a workflow that exists solely on a non-default
# branch); push runs execute the normal today+yesterday import, which is a
# safe idempotent smoke.

name: pf-evening-results

on:
  schedule:
    - cron: "30 10 * * *"  # 20:30 AEST (21:30 AEDT) daily — evening results
  workflow_dispatch:
    inputs:
      date:
        description: "Single date to import (ISO); empty = today + yesterday AEST"
        default: ""

permissions:
  contents: read

concurrency:
  group: pf-evening-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install psycopg2
        run: pip install --quiet psycopg2-binary
      - name: Import results (today + yesterday AEST)
        env:
          PUNTINGFORM_API_KEY: ${{ secrets.PUNTINGFORM_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          set -o pipefail
          if [ -n "$DATE_INPUT" ]; then
            DATES="$DATE_INPUT"
          else
            TODAY=$(TZ=Australia/Sydney date +%F)
            YEST=$(TZ=Australia/Sydney date -d 'yesterday' +%F)
            DATES="$YEST $TODAY"
          fi
          echo "importing results for: $DATES"
          for D in $DATES; do
            echo "=== import $D ==="
            python3 server/python/fetch_and_import_date.py --date "$D" 2>&1 | tee "import_$D.log"
          done
      - name: Per-meeting row counts -> run summary
        if: always()
        run: |
          {
            echo "## PF evening results import"
            for f in import_*.log; do
              [ -e "$f" ] || continue
              echo
              echo "### ${f#import_} (${f%.log})"
              grep -E "Runners imported|already existed|Runners skipped" "$f" || true
              echo '```'
              grep -E "^    .+: [0-9]+ races, [0-9]+ runners$" "$f" || echo "(no resulted meetings)"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
