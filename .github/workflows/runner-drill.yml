# Reboot drill for stride-syd-runner (work order item 5). Run AFTER the
# deploy has landed and between snapshot windows, never before either.
#
# mode=audit      inventory only: service config, sudo capability, and
#                 everything on the box that is outside version control.
# mode=stopstart  stop the runner service, start it again, prove it returns.
#                 (The job survives because systemd restarts the service
#                 after the current job finishes; verification is the next
#                 dispatched run.)
# mode=reboot     schedule a reboot in one minute and exit; the box goes
#                 down AFTER this job completes. Verification = runner shows
#                 online again and a dispatched job runs post-restart.
name: runner-drill

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: "audit"
        options: ["audit", "stopstart", "reboot", "purge-aws-creds"]

permissions:
  contents: read

jobs:
  drill:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Boot time and sudo capability
        run: |
          # Boot time is the drill's actual evidence: a job that merely runs
          # proves nothing unless the box booted since the reboot was issued.
          echo "now:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "booted at:  $(uptime -s) UTC-local"
          echo "uptime:     $(uptime -p)"
          sudo -n true && echo "passwordless sudo: YES" || echo "passwordless sudo: NO — drill needs the operator"
      - name: Service configuration
        run: |
          systemctl list-units --type=service --no-pager | grep -i actions.runner || true
          SVC=$(systemctl list-units --type=service --no-pager | grep -io 'actions\.runner[^ ]*\.service' | head -1)
          echo "service: ${SVC:-NOT FOUND}"
          [ -n "$SVC" ] && systemctl is-enabled "$SVC" && systemctl show "$SVC" -p Restart -p WantedBy --no-pager
      - name: Outside-version-control inventory
        run: |
          echo "== crontab:"; crontab -l 2>/dev/null || echo "(none)"
          echo "== home:"; ls -la "$HOME" | head -20
          echo "== docker images:"; docker images 2>/dev/null | head -10 || echo "(docker unavailable to this user)"
          echo "== runner dir:"; ls "$HOME"/actions-runner 2>/dev/null | head -10
          echo "== enabled custom units:"; systemctl list-unit-files --state=enabled --no-pager | grep -v "@\|systemd\|dbus\|network\|ssh\|cron\|getty\|cloud\|snap" | head -15
      - name: Credential material inventory
        run: |
          # THIS REPO IS PUBLIC, so this log is public. Report PRESENCE and
          # SHAPE only — never a key id, a secret, a token or a connection
          # string. Anything added here must survive being read by a
          # stranger. Counts and filenames are safe; values never are.
          echo "== ~/.aws contents (names + modes only):"
          ls -la "$HOME/.aws" 2>/dev/null || echo "(no ~/.aws)"
          for f in credentials config; do
            P="$HOME/.aws/$f"
            if [ -f "$P" ]; then
              echo "-- $f: present, mode $(stat -c '%a' "$P")"
              echo "   profiles: $(grep -c '^\[' "$P" 2>/dev/null || echo 0)"
              echo "   static access-key entries: $(grep -ci 'aws_access_key_id' "$P" 2>/dev/null || echo 0)"
              echo "   sso/role entries: $(grep -ciE 'sso_|role_arn' "$P" 2>/dev/null || echo 0)"
            else
              echo "-- $f: absent"
            fi
          done
          echo "== other credential-shaped files on the box:"
          for P in "$HOME/stride-racing/.env" "$HOME/stride-racing/Race-Analytics/.env"; do
            [ -f "$P" ] && echo "   $P present ($(wc -l < "$P") lines) mode $(stat -c '%a' "$P")" || true
          done
          find "$HOME" -maxdepth 3 \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) \
            -printf '   %p (mode %m)\n' 2>/dev/null | head -10
          echo "== git remotes in the runner's clone (host only):"
          git -C "$HOME/stride-racing" remote -v 2>/dev/null \
            | sed -E 's#(https://)[^@]*@#\1<redacted>@#g' | head -4 || echo "   (no clone)"

      - name: Purge the static AWS key
        if: ${{ inputs.mode == 'purge-aws-creds' }}
        run: |
          # The audit found ~/.aws/credentials holding one long-lived access
          # key and zero role/SSO entries — precisely what the OIDC migration
          # was meant to end ("no long-lived keys sitting anywhere"). Nothing
          # needs it: all six self-hosted workflows make zero AWS calls, and
          # AWS-touching workflows run on ubuntu-latest via OIDC. This box
          # executes code from a PUBLIC repo, so a static key here is the
          # worst place for one.
          #
          # Deliberately prints nothing identifying: the key id is located in
          # IAM by last-used metadata, not by echoing it to a public log.
          P="$HOME/.aws/credentials"
          if [ ! -f "$P" ]; then echo "already absent — nothing to purge"; exit 0; fi
          shred -u "$P" 2>/dev/null || rm -f "$P"
          if [ -f "$P" ]; then echo "::error::purge FAILED, file still present"; exit 1; fi
          echo "purged $P"
          echo "::warning::File removed. The key is still ACTIVE in IAM until it is deactivated there — that is the other half of this fix."

      - name: Harden + stop/start cycle
        if: ${{ inputs.mode == 'stopstart' }}
        run: |
          SVC=$(systemctl list-units --type=service --no-pager | grep -io 'actions\.runner[^ ]*\.service' | head -1)
          # The audit found Restart=no: the service survives a reboot (it is
          # enabled) but NOT a crash, which would silently stop snapshot
          # capture until someone noticed. Add a drop-in so it restarts.
          sudo -n mkdir -p "/etc/systemd/system/${SVC}.d"
          printf '[Service]\nRestart=always\nRestartSec=10\n' \
            | sudo -n tee "/etc/systemd/system/${SVC}.d/restart.conf" >/dev/null
          sudo -n systemctl daemon-reload
          systemctl show "$SVC" -p Restart -p RestartUSec --no-pager
          echo "cycling $SVC after this job completes (systemd queues it)"
          sudo -n systemd-run --on-active=30 systemctl restart "$SVC"
          echo "restart scheduled in 30s"
      - name: Reboot
        if: ${{ inputs.mode == 'reboot' }}
        run: |
          sudo -n shutdown -r +1 "runner drill: rebooting in 1 minute"
          echo "reboot scheduled; verify with: gh api repos/{owner}/{repo}/actions/runners"
