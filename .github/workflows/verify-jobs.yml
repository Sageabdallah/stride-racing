# Execute every job that is safe to run out-of-schedule, once, and report
# its real exit status. The WP-7 stack shipped five latent defects that
# only appeared on first execution; the remedy is to execute, not to read.
#
# Excluded by design (data honesty, not laziness):
#   tips-pipeline      an evening run would re-upsert day-1 ledger rows at
#                      post-race prices and contaminate the registered window
#   tip-time-snapshot  writing tip_time rows after the last jump is exactly
#                      what the WP-2 post-jump guard exists to prevent
#   morning-odds       'morning' snapshot rows written at night are a lie
#   consensus-agent    real LLM spend + overwrites today's consensus file
# Those four are verified by their own scheduled slots tomorrow.
name: verify-jobs

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated job names (default: the safe set)"
        default: "calibrator-coverage,bsp-settle,late-odds-watch,weekly-digest,racecard-collect,results-collect,nightly-etl,gap-heal"
      date:
        description: "Optional race date (YYYY-MM-DD) the Fargate jobs run for, passed as STRIDE_DATE. Empty = today in Sydney. Lets the chain be run early for a chosen day (racecard-collect, intelligence-build, consensus-agent, tips-proof); never combine with tips-pipeline, which writes the ledger."
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: verify-jobs
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-southeast-2
      # Must match 05_lambda_jobs.sh exactly. calibrator-coverage moved to
      # Fargate (its import chain writes); leaving it here made verify hit
      # the orphaned Lambda and report a fixed defect as still broken.
      LAMBDA_JOBS: "tip-time-snapshot late-odds-watch bsp-settle weekly-digest"
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/stride-deploy-oidc
          aws-region: ap-southeast-2

      - name: Run each job and report
        run: |
          PASS=""; FAIL=""
          for JOB in $(echo "${{ inputs.jobs }}" | tr ',' ' '); do
            echo "::group::$JOB"
            OK=0
            if echo "$LAMBDA_JOBS" | grep -qw "$JOB"; then
              # Lambda: a handler exception surfaces as FunctionError.
              aws lambda invoke --function-name "stride-$JOB" \
                --cli-read-timeout 900 /tmp/out.json > /tmp/meta.json 2>&1 || OK=1
              cat /tmp/meta.json; echo; head -c 2000 /tmp/out.json; echo
              grep -q FunctionError /tmp/meta.json && OK=1
              # `logs tail`, not describe+get: Lambda stream names contain
              # [$LATEST], and $LATEST expands to empty inside double quotes,
              # so the stream name never resolved and the real error stayed
              # hidden behind "log stream does not exist".
              aws logs tail "/aws/lambda/stride-$JOB" --since 15m \
                --format short 2>/dev/null | tail -60 || true
            else
              # Proof variants share a task definition with the real job and
              # select themselves through the STRIDE_JOB override.
              case "$JOB" in
                tips-proof)      TD=stride-tips-pipeline ;;
                consensus-proof) TD=stride-consensus-agent ;;
                panel-proof)     TD=stride-consensus-agent ;;
                *)               TD="stride-$JOB" ;;
              esac
              DATE_ENV=""
              if [ -n "${{ inputs.date }}" ]; then
                DATE_ENV=",{\"name\":\"STRIDE_DATE\",\"value\":\"${{ inputs.date }}\"}"
              fi
              OVR="{\"containerOverrides\":[{\"name\":\"job\",\"environment\":[{\"name\":\"STRIDE_JOB\",\"value\":\"$JOB\"}$DATE_ENV]}]}"
              TASK=$(aws ecs run-task --cluster stride \
                --task-definition "$TD" --launch-type FARGATE \
                --overrides "$OVR" \
                --network-configuration "awsvpcConfiguration={subnets=[${{ vars.AWS_SUBNET_ID }}],securityGroups=[${{ vars.AWS_SG_ID }}],assignPublicIp=ENABLED}" \
                --query 'tasks[0].taskArn' --output text) || OK=1
              LOG_JOB="${TD#stride-}"
              echo "task: $TASK"
              for i in $(seq 1 60); do
                sleep 20
                ST=$(aws ecs describe-tasks --cluster stride --tasks "$TASK" \
                  --query 'tasks[0].lastStatus' --output text)
                [ "$ST" = "STOPPED" ] && break
              done
              EXIT=$(aws ecs describe-tasks --cluster stride --tasks "$TASK" \
                --query 'tasks[0].containers[0].exitCode' --output text)
              REASON=$(aws ecs describe-tasks --cluster stride --tasks "$TASK" \
                --query 'tasks[0].stoppedReason' --output text)
              echo "exit=$EXIT reason=$REASON"
              [ "$EXIT" = "0" ] || OK=1
              # Last log lines: the actual failure text, not just a code.
              aws logs tail "/ecs/stride-${LOG_JOB:-$JOB}" --since 20m \
                --format short 2>/dev/null | tail -60 || true
            fi
            if [ "$OK" = "0" ]; then PASS="$PASS $JOB"; else FAIL="$FAIL $JOB"; fi
            echo "::endgroup::"
          done
          echo "=============================="
          echo "PASSED:$PASS"
          echo "FAILED:$FAIL"
          echo "=============================="
          [ -z "$FAIL" ]

      - name: Run-state after the sweep
        if: always()
        run: aws dynamodb scan --table-name stride_run_state --output table
