# Execute every job that is safe to run out-of-schedule, once, and report
# its real exit status. The WP-7 stack shipped five latent defects that
# only appeared on first execution; the remedy is to execute, not to read.
#
# Excluded by design (data honesty, not laziness):
#   tips-pipeline      an evening run would re-upsert day-1 ledger rows at
#                      post-race prices and contaminate the registered window
#   tip-time-snapshot  writing tip_time rows after the last jump is exactly
#                      what the WP-2 post-jump guard exists to prevent
#   morning-odds       'morning' snapshot rows written at night are a lie
#   consensus-agent    real LLM spend + overwrites today's consensus file
# Those four are verified by their own scheduled slots tomorrow.
#
# With `date` set the same jobs run for a chosen day instead (a Friday preview
# of Saturday's card): the writes above then land on rows the real run for
# that day upserts over a few hours later. `llm_provider` pins the LLM for one
# dispatch, and `llm-proof` is the two-pick check to run before a preview whose
# insights are the point.
name: verify-jobs

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated job names (default: the safe set)"
        default: "calibrator-coverage,bsp-settle,late-odds-watch,weekly-digest,racecard-collect,results-collect,nightly-etl,gap-heal"
      date:
        description: "Optional race date (YYYY-MM-DD) the Fargate jobs run for, passed as STRIDE_DATE. Empty = today in Sydney. Lets the chain be run early for a chosen day (racecard-collect, intelligence-build, consensus-agent, tips-proof); never combine with tips-pipeline, which writes the ledger."
        default: ""
      llm_provider:
        description: "Optional LLM provider for THIS dispatch (groq | anthropic | ollama), set on the task as LLM_PROVIDER with LLM_ENABLED=true. The task environment wins over the stride/prod secret, so this changes one run and never the schedule. Empty = whatever the secret says."
        default: ""
      tracks:
        description: "Optional comma-separated track filter for tips-proof, e.g. 'Randwick,Eagle Farm'. Empty = the whole card. A 55-race Saturday is 4-5h and cannot be watched to completion (see wait_minutes); a four-track subset is roughly 3.5h. Ignored by every other job."
        default: ""
      bsp_range:
        description: "Date range for bsp-corpus as 'YYYY-MM-DD..YYYY-MM-DD' (inclusive). Empty = yesterday only. Each day is one small CSV, so a year is roughly 365 fetches — run it in chunks that fit inside wait_minutes. Ignored by every other job."
        default: ""
      wait_minutes:
        description: "Minutes to wait for each Fargate task before reading its exit code (1-55, default 20). HARD CEILING 55: the OIDC role session lasts one hour, after which every AWS call in this job fails and the task can no longer be observed from here. A job that runs longer is dispatched and reported STILL RUNNING with its task ARN — it keeps running on ECS and must be tracked by its artifact, not by this workflow."
        default: "20"

permissions:
  id-token: write
  contents: read

concurrency:
  group: verify-jobs
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bounded by wait_minutes (capped at 300) plus dispatch overhead, per job.
    timeout-minutes: 360
    env:
      AWS_REGION: ap-southeast-2
      # Must match 05_lambda_jobs.sh exactly. calibrator-coverage moved to
      # Fargate (its import chain writes); leaving it here made verify hit
      # the orphaned Lambda and report a fixed defect as still broken.
      LAMBDA_JOBS: "tip-time-snapshot late-odds-watch bsp-settle weekly-digest"
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/stride-deploy-oidc
          aws-region: ap-southeast-2

      - name: Run each job and report
        # Inputs reach the script as environment variables, never as ${{ }}
        # inside the shell text. Interpolated directly, GitHub substitutes them
        # into the source BEFORE bash parses it, so the wait_minutes `case`
        # validation below ran downstream of its own injection point: a value
        # like 20"; some-command; :" executed with the deploy OIDC role already
        # assumed, and then validated cleanly. As env vars the shell sees data.
        env:
          IN_JOBS: ${{ inputs.jobs }}
          IN_DATE: ${{ inputs.date }}
          IN_LLM_PROVIDER: ${{ inputs.llm_provider }}
          IN_TRACKS: ${{ inputs.tracks }}
          IN_BSP_RANGE: ${{ inputs.bsp_range }}
          IN_WAIT: ${{ inputs.wait_minutes }}
          SUBNET_ID: ${{ vars.AWS_SUBNET_ID }}
          SG_ID: ${{ vars.AWS_SG_ID }}
        run: |
          PASS=""; FAIL=""; RUNNING=""
          WAIT="$IN_WAIT"
          case "$WAIT" in ''|*[!0-9]*) WAIT=20 ;; esac
          # Base 10 explicitly: the case above accepts "030", and $(( )) reads a
          # leading zero as octal, so a padded 030 silently waited 24 minutes.
          WAIT=$((10#$WAIT))
          if [ "$WAIT" -lt 1 ]; then WAIT=1; fi
          # 55, not 300. The OIDC role session assumed above lasts ONE HOUR.
          # On 2026-09-04 a consensus run was given wait_minutes=150; at exactly
          # 60 minutes describe-tasks began returning ExpiredTokenException and
          # the step died with exit 254, reporting a red run for a Fargate task
          # that was still healthily running and untouched. Waiting longer than
          # the credentials live cannot work: past this point the workflow can
          # no longer observe anything, so it must say so rather than spin.
          if [ "$WAIT" -gt 55 ]; then
            echo "::warning::wait_minutes=$WAIT exceeds the 55m OIDC session ceiling; clamping to 55. Longer jobs are dispatched and tracked by their artifact."
            WAIT=55
          fi
          echo "waiting up to ${WAIT}m per Fargate task"
          # The header lists four jobs excluded by design; for the two that
          # write dated rows that is a rule the workflow must enforce, not a
          # sentence in an input description. tips-proof and tips-pipeline
          # differ by six characters and both are plausible things to type at
          # 10pm — and tips-pipeline is a live dispatcher key that writes the
          # ledger and the file the frontend reads.
          for JOB in $(echo "$IN_JOBS" | tr ',' ' '); do
            case "$JOB" in
              tips-pipeline|tip-time-snapshot)
                if [ -n "$IN_DATE" ]; then
                  echo "::error::$JOB writes dated rows for the date it runs; refusing to run it with date=$IN_DATE. Use tips-proof for a preview."
                  exit 1
                fi
                ;;
            esac
          done
          for JOB in $(echo "$IN_JOBS" | tr ',' ' '); do
            echo "::group::$JOB"
            OK=0
            if echo "$LAMBDA_JOBS" | grep -qw "$JOB"; then
              # Lambda: a handler exception surfaces as FunctionError.
              aws lambda invoke --function-name "stride-$JOB" \
                --cli-read-timeout 900 /tmp/out.json > /tmp/meta.json 2>&1 || OK=1
              cat /tmp/meta.json; echo; head -c 2000 /tmp/out.json; echo
              grep -q FunctionError /tmp/meta.json && OK=1
              # `logs tail`, not describe+get: Lambda stream names contain
              # [$LATEST], and $LATEST expands to empty inside double quotes,
              # so the stream name never resolved and the real error stayed
              # hidden behind "log stream does not exist".
              aws logs tail "/aws/lambda/stride-$JOB" --since 15m \
                --format short 2>/dev/null | tail -60 || true
            else
              # Proof variants share a task definition with the real job and
              # select themselves through the STRIDE_JOB override.
              case "$JOB" in
                tips-proof)      TD=stride-tips-pipeline ;;
                llm-proof)       TD=stride-tips-pipeline ;;
                consensus-proof) TD=stride-consensus-agent ;;
                panel-proof)     TD=stride-consensus-agent ;;
                # No task definition of their own: they need the image, a
                # DATABASE_URL and outbound HTTPS, which the ETL task already
                # has. Adding a definition would mean editing infra/*.sh, and
                # those scripts call update-schedule, which is full-replacement.
                bsp-sample)      TD=stride-nightly-etl ;;
                bsp-corpus)      TD=stride-nightly-etl ;;
                *)               TD="stride-$JOB" ;;
              esac
              EXTRA_ENV=""
              if [ -n "$IN_DATE" ]; then
                EXTRA_ENV="$EXTRA_ENV,{\"name\":\"STRIDE_DATE\",\"value\":\"$IN_DATE\"}"
              fi
              if [ -n "$IN_LLM_PROVIDER" ]; then
                # Both variables: LLM_ENABLED=false in the secret would
                # otherwise make the provider choice a no-op.
                EXTRA_ENV="$EXTRA_ENV,{\"name\":\"LLM_PROVIDER\",\"value\":\"$IN_LLM_PROVIDER\"},{\"name\":\"LLM_ENABLED\",\"value\":\"true\"}"
              fi
              if [ -n "$IN_TRACKS" ]; then
                EXTRA_ENV="$EXTRA_ENV,{\"name\":\"STRIDE_TRACKS\",\"value\":\"$IN_TRACKS\"}"
              fi
              if [ -n "$IN_BSP_RANGE" ]; then
                # 'A..B' -> two variables. Split here rather than in the job so
                # a malformed range fails before a container is paid for.
                BSP_SINCE="${IN_BSP_RANGE%%..*}"
                BSP_UNTIL="${IN_BSP_RANGE##*..}"
                case "$BSP_SINCE$BSP_UNTIL" in
                  ????-??-?????-??-??) ;;
                  *) echo "::error::bsp_range must be YYYY-MM-DD..YYYY-MM-DD, got '$IN_BSP_RANGE'"; exit 1 ;;
                esac
                EXTRA_ENV="$EXTRA_ENV,{\"name\":\"STRIDE_BSP_SINCE\",\"value\":\"$BSP_SINCE\"},{\"name\":\"STRIDE_BSP_UNTIL\",\"value\":\"$BSP_UNTIL\"}"
              fi
              OVR="{\"containerOverrides\":[{\"name\":\"job\",\"environment\":[{\"name\":\"STRIDE_JOB\",\"value\":\"$JOB\"}$EXTRA_ENV]}]}"
              TASK=$(aws ecs run-task --cluster stride \
                --task-definition "$TD" --launch-type FARGATE \
                --overrides "$OVR" \
                --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
                --query 'tasks[0].taskArn' --output text) || OK=1
              LOG_JOB="${TD#stride-}"
              echo "task: $TASK"
              # run-task failing left TASK empty and fell straight into the
              # wait, where describe-tasks --tasks "" fails botocore validation
              # and exits 252 — and under the default `bash -e`, ST=$(...) with
              # a failing command kills the whole step. Every job after the
              # failed one was silently never dispatched, with no summary line
              # to read. Skip to the report instead.
              if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
                echo "::error::$JOB: run-task returned no task ARN; not dispatched"
                OK=1
                ST=""
              else
                ST=""
                BLIND=0
                for i in $(seq 1 $((WAIT * 3))); do
                  sleep 20
                  # 2>&1 not 2>/dev/null: the reason the call failed is the
                  # whole diagnosis, and discarding it is what made an expired
                  # token look like a task problem for an hour.
                  ST=$(aws ecs describe-tasks --cluster stride --tasks "$TASK" \
                    --query 'tasks[0].lastStatus' --output text 2>&1 || echo "CALL_FAILED")
                  case "$ST" in
                    STOPPED) break ;;
                    *ExpiredToken*|*CALL_FAILED*|*error*|*Error*)
                      BLIND=$((BLIND + 1))
                      # Three consecutive failures is a dead credential, not a
                      # blip. Keeping the loop alive past that only burns time
                      # we cannot see through.
                      if [ "$BLIND" -ge 3 ]; then
                        echo "::warning::$JOB: cannot observe the task any more (last AWS response: $ST). The task is UNAFFECTED and still running."
                        ST="UNOBSERVABLE"
                        break
                      fi
                      ;;
                    *) BLIND=0 ;;
                  esac
                done
                EXIT=$(aws ecs describe-tasks --cluster stride --tasks "$TASK" \
                  --query 'tasks[0].containers[0].exitCode' --output text 2>/dev/null || echo None)
                REASON=$(aws ecs describe-tasks --cluster stride --tasks "$TASK" \
                  --query 'tasks[0].stoppedReason' --output text 2>/dev/null || echo None)
                echo "status=$ST exit=$EXIT reason=$REASON"
                # "Still running when the wait expired" is not the same event as
                # "the job failed", and reporting both as FAILED invited exactly
                # the wrong response: a re-dispatch that puts a SECOND writer on
                # the same date while the first is still going. Reported apart.
                if [ "$ST" = "UNOBSERVABLE" ]; then
                  echo "::warning::$JOB: credentials expired before the task finished. Task $TASK is still running on ECS; this workflow simply lost the ability to watch it. NOT a failure, and re-dispatching would start a SECOND writer for the same date."
                  OK=2
                elif [ "$ST" != "STOPPED" ]; then
                  echo "::warning::$JOB still RUNNING after ${WAIT}m — not a failure. Task $TASK is still going; do NOT re-dispatch. Track its output artifact instead."
                  OK=2
                elif [ "$EXIT" != "0" ]; then
                  OK=1
                fi
              fi
              # Last log lines: the actual failure text, not just a code.
              aws logs tail "/ecs/stride-${LOG_JOB:-$JOB}" --since "$((WAIT + 5))m" \
                --format short 2>/dev/null | tail -60 || true
            fi
            if [ "$OK" = "0" ]; then PASS="$PASS $JOB"
            elif [ "$OK" = "2" ]; then RUNNING="$RUNNING $JOB"
            else FAIL="$FAIL $JOB"; fi
            echo "::endgroup::"
          done
          echo "=============================="
          echo "PASSED:$PASS"
          echo "STILL RUNNING (not a failure, do not re-dispatch):$RUNNING"
          echo "FAILED:$FAIL"
          echo "=============================="
          [ -z "$FAIL" ]

      - name: Run-state after the sweep
        if: always()
        run: aws dynamodb scan --table-name stride_run_state --output table
